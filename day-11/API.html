<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: #fff">
    <h1>learning API</h1>

    <div id="card" style="height: 500px; width: 400px; border: 2px solid; border-color: wheat; border-radius: 10px; display: flex; justify-content: center; flex-direction: column; align-items: center; padding: 10px;">
        <div style="border: 5px; height:200px; width: 200px; border-radius: 50%; overflow: hidden; border: 1px solid; border-color: #fff;" >
            <img src="https://plus.unsplash.com/premium_photo-1791312841817-e3980e0930ca?q=80&w=790&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" id="profilePic" alt="" style="height:200px; width: 200px;">
        </div>

        <h1 id="name"></h1>
        <h2 id="follower">Followers:- </h2>

    </div>
    
</body>
<script>
    const requestUrl = 'https://api.github.com/users/mythlessxcode';
    //   let profilePic = document.querySelector('#profilePic');
    // let name = document.querySelector('#name');
    // let follower = document.querySelector('#follower');

    const xhr = new XMLHttpRequest();
    xhr.open('GET', requestUrl)
  
    xhr.onreadystatechange = function(){
        console.log(xhr.readyState);
        if(xhr.readyState ===4){
            const data = JSON.parse(this.responseText);
            let follower = data.followers;
            document.querySelector('#follower').append(follower);
                // console.log(data);
                
            let name = data.name;
            document.querySelector('#name').append(name);

            let profilePic = data.avatar_url;
            let img =document.querySelector('#profilePic');
            img.src = profilePic;
        }
        
    }

    xhr.send();


</script>
</html>
